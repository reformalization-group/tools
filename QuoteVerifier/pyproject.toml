[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-quote-verifier"
version = "0.1.0"
description = "Deterministic arXiv quote verification API and reference linter"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.urls]
Repository = "https://github.com/reformalization-group/tools"

[project.scripts]
quote-verifier = "quote_verifier.cli:main"

[tool.setuptools.packages.find]
include = ["quote_verifier*"]
